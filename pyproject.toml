[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-re"
version = "0.1.0"
description = "General-purpose reverse-engineering toolkit: capture a target's surface, catalog it, infer schemas, and decode opaque codes into meaning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tisone Kironget" }]
keywords = ["reverse-engineering", "api", "capture", "schema-inference", "openapi", "har"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
# The core library (catalog, capture-HAR, schema, rosetta, sensitive, …) is
# pure-stdlib and imports with no third-party deps. The only runtime
# dependency is `rich`, used solely by the CLI presentation layer for
# tables/panels/color across platforms (incl. Windows); it is lazily
# imported so `import glyph` still works without it, and the CLI degrades to
# plain text if it is somehow absent. Heavy backends stay optional (below).
dependencies = ["rich>=13"]

[project.optional-dependencies]
# Live capture backends (proxy + browser driver).
live = ["mitmproxy>=10", "playwright>=1.40"]
# Higher-fidelity JSON Schema inference (the pure-python inferer is the fallback).
schema = ["genson>=1.2"]
# Columnar catalog store for drift analytics (post-MVP promotion path, ADR-2).
analytics = ["duckdb>=0.10"]
# Interactive terminal dashboard (Textual TUI over the catalog).
tui = ["textual>=0.60"]
# VPN-Config Decoder — AES/ChaCha20/PBKDF2 for decrypting .hc/.ehi/.ziv/.tls
# config files (ADR-11). Graceful fallback: without it, plain formats (DARK
# envelope, OVPN) still decode; crypto-dependent formats report no_decryptor.
crypto = ["pycryptodome>=3.20"]
# Everything, plus test tooling.
dev = ["glyph-re[live,schema,analytics,tui,crypto]", "pytest>=7"]

[project.scripts]
glyph = "glyph.cli:main"

[project.urls]
Homepage = "https://github.com/TisoneK/glyph"
Repository = "https://github.com/TisoneK/glyph"

[tool.setuptools.packages.find]
include = ["glyph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
