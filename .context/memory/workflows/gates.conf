# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
#
# Each command runs through `sh -c` from the repo root, so shell syntax is
# available. `_py` resolves the project venv interpreter for both machines this
# project is developed on: POSIX puts it in .venv/bin, Windows in
# .venv/Scripts. The system Python has no pytest/ruff on either box, and the
# venv is gitignored — a fresh clone must `pip install -e '.[dev]'` first.
#
# Glyph: pure-Python project (pyproject.toml), tests under tests/ with pytest,
# linted with ruff (ruleset in pyproject.toml [tool.ruff]).
# checkpoint needs no command — it is a state refresh (git status + collab).
pre-commit|_py=.venv/bin/python; [ -x "$_py" ] || _py=.venv/Scripts/python.exe; "$_py" -m ruff check .
pre-commit|_py=.venv/bin/python; [ -x "$_py" ] || _py=.venv/Scripts/python.exe; "$_py" -m pytest -q
integration|_py=.venv/bin/python; [ -x "$_py" ] || _py=.venv/Scripts/python.exe; "$_py" -m pytest -q
exit|_py=.venv/bin/python; [ -x "$_py" ] || _py=.venv/Scripts/python.exe; "$_py" -m ruff check .
exit|_py=.venv/bin/python; [ -x "$_py" ] || _py=.venv/Scripts/python.exe; "$_py" -m pytest -q
