# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context/core/bin/context-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
# Examples (uncomment and adapt to this project):
# pre-commit|npm run typecheck
# pre-commit|npm run lint
# pre-commit|npm test
# integration|npm run build
# exit|npm run test

# Glyph: pure-Python project (pyproject.toml), unit tests under tests/
# with pytest. No lint/typecheck tooling configured; the test suite is the
# project check (live-browser tests skip when the `live` extra is absent).
# checkpoint needs no command — it is a state refresh (git status + collab).
# Tests run under the project venv: the system `python3` (3.9.6) has no
# pytest, and `.venv/` is gitignored but present on this machine.
pre-commit|.venv/bin/python -m pytest
integration|.venv/bin/python -m pytest
exit|.venv/bin/python -m pytest
